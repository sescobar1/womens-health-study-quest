<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Study Game</title><style>
:root{--navy:#182c61;--blue:#376fe6;--purple:#7442c8;--gold:#ffd34e;--ink:#14213d;--mist:#eef4ff;--good:#078757;--bad:#c74745;--shadow:0 18px 44px #14213d24}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 7% 8%,#ffe67f 0 3%,transparent 3.2%),radial-gradient(circle at 92% 13%,#90d3ff 0 5%,transparent 5.2%),linear-gradient(135deg,#eff7ff 0%,#f9f3ff 48%,#fff9df 100%);color:var(--ink);font:17px/1.5 "Trebuchet MS",Arial,sans-serif}.app{max-width:980px;margin:auto;padding:30px 18px 56px}header{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--navy),#315bb6 60%,#7147c8);color:#fff;border-radius:28px;padding:30px 32px;box-shadow:var(--shadow)}header:after{content:"✦ ✚ ✦";position:absolute;right:28px;bottom:-15px;font-size:4.5rem;color:#fff3;letter-spacing:.15em}h1{margin:0;font-size:clamp(2.05rem,5vw,3.35rem);letter-spacing:-.04em}header p{max-width:690px;margin:.5rem 0 0;color:#edf4ff}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:19px 0 12px}.pill{background:#fff;border:2px solid #fff;border-radius:999px;padding:9px 15px;font-weight:800;box-shadow:0 5px 14px #12335b18}.track{height:12px;background:#ffffffaa;border-radius:999px;overflow:hidden;margin:0 2px 18px;box-shadow:inset 0 1px 4px #12335b22}.track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff9d45);border-radius:inherit;transition:width .35s ease}.card{position:relative;background:#fff;border:1px solid #e5ebff;border-radius:28px;padding:clamp(22px,4vw,40px);box-shadow:var(--shadow)}.card:before{content:"";position:absolute;left:0;top:32px;bottom:32px;width:6px;border-radius:0 8px 8px 0;background:linear-gradient(var(--blue),var(--purple))}.topic{display:inline-block;color:var(--blue);background:#edf3ff;border-radius:999px;padding:6px 11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:.79rem}.question{font-size:clamp(1.3rem,3vw,1.75rem);font-weight:800;line-height:1.33;margin:15px 0 26px}.answers{display:grid;gap:12px}.answer{position:relative;background:#fff;border:2px solid #d9e3f4;border-radius:18px;padding:16px 18px;text-align:left;font:inherit;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}.answer:hover,.answer:focus{border-color:var(--blue);background:#f4f7ff;transform:translateY(-2px);box-shadow:0 8px 16px #376fe620}.answer:disabled{cursor:default;transform:none}.answer.correct{background:#e9f9f1;border-color:var(--good);color:#075f40}.answer.wrong{background:#fff0f0;border-color:var(--bad);color:#8d2929}button{font:inherit;font-weight:900}.next{display:none;margin-top:22px;background:linear-gradient(110deg,var(--navy),var(--purple));color:#fff;border:0;border-radius:14px;padding:14px 21px;cursor:pointer;box-shadow:0 7px 14px #182c6133}.next:hover{filter:brightness(1.08);transform:translateY(-1px)}.rationale{display:none;margin-top:23px;padding:19px;border-radius:18px;background:var(--mist);border:1px solid #dbe6ff}.rationale b{color:var(--navy)}.rationale ul{margin:11px 0 0;padding-left:1.2rem}.rationale li{margin:.35rem 0}.summary{display:none;text-align:center}.summary h2{font-size:2rem}.restart{background:linear-gradient(110deg,var(--gold),#ffad51);border:0;border-radius:14px;padding:14px 21px;cursor:pointer;box-shadow:0 7px 14px #b5782533}@media(max-width:540px){.app{padding:15px}.card,header{border-radius:20px;padding:22px}.card:before{top:24px;bottom:24px}.answer{padding:14px}.pill{font-size:.9rem}}
</style></head><body><main class="app"><header><h1>Women’s Health Study Quest ✦</h1><p>Adaptive NCLEX and ATI-style practice for Women’s Health, GYN Surgery, Culture, Family, and Historical Perspectives.</p></header><section class="bar"><span class="pill" id="progress">Question 1</span><span class="pill" id="level">Level: Building</span><span class="pill" id="score">Correct: 0</span></section><div class="track" aria-label="Round progress"><span id="progressFill"></span></div><section class="card" id="game"><div class="topic" id="topic"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="rationale" id="rationale"></div><button class="next" id="next">Continue quest</button></section><section class="card summary" id="summary"><h2>Quest complete! ✦</h2><p id="result"></p><button class="restart" id="restart">Start another adaptive round</button></section></main><script>
// Every question and rationale is drawn only from the course lecture PowerPoints and Exam Blueprint.
document.querySelector('header p').insertAdjacentHTML('afterend','<p style="margin-top:.8rem;font-size:.85rem;font-weight:800">Course source: your lecture PowerPoints + Exam Blueprint only</p>');
const bank=[
['Infertility','A nurse is teaching a couple about the initial evaluation for infertility. Which test is the priority for the male partner?',['Hysterosalpingogram','Semen analysis','Laparoscopy','Clomiphene challenge test'],1,'Semen analysis is the first, least expensive, and most important initial male fertility test.'],
['Menstrual Disorders','A client has no menstrual periods for three cycles after previously regular menses. How should the nurse document this finding?',['Primary amenorrhea','Secondary amenorrhea','Primary dysmenorrhea','Perimenopause'],1,'Secondary amenorrhea is absence of menses for three cycles after previously regular periods.'],
['Endometriosis','Which finding most strongly supports endometriosis?',['Pelvic pain and dysmenorrhea unrelieved by NSAIDs','Painless heavy bleeding after intercourse','A firm breast mass under the areola','Sudden urge to void with nocturia'],0,'Endometriosis commonly produces progressive pelvic pain and dysmenorrhea not relieved by NSAIDs. Laparoscopy confirms the diagnosis.'],
['PCOS','A client with PCOS asks why weight management is recommended. Which response is best?',['It prevents HSV recurrence','It can improve insulin resistance and ovulation','It eliminates the need for screening','It cures ovarian cysts'],1,'PCOS is associated with insulin resistance, anovulation, infertility, obesity, type 2 diabetes, and endometrial cancer risk.'],
['STIs','A pregnant client has active genital HSV lesions at the onset of labor. Which intervention should the nurse anticipate?',['Vaginal birth with forceps','Cesarean birth','Oxytocin induction','Delayed cord clamping only'],1,'Active HSV lesions at delivery are an indication for cesarean birth to reduce neonatal exposure.'],
['Menopause','Which statement by a client demonstrates understanding of menopause?',['Menopause is confirmed after 12 months without menses','FSH decreases during menopause','A hysterectomy always causes menopause','Heavy bleeding is expected and should not be reported'],0,'Menopause is 12 consecutive months without a period. FSH rises and estrogen falls.'],
['Osteoporosis','Which result confirms osteoporosis?',['DEXA T-score of -1.0','DEXA T-score of -2.5','Elevated FSH','Positive Pap smear'],1,'A DEXA T-score of -2.5 or lower indicates osteoporosis.'],
['Cesarean Birth','During the first 2 hours after a cesarean birth, which assessment is a priority?',['Fundus, bleeding, urine output, and pain','Visual acuity only','Breast self-exam','Fasting blood glucose only'],0,'Post-cesarean recovery includes 1:1 care with frequent assessment of fundus, bleeding, urine output, and pain.'],
['Postoperative Fever','A postoperative client has a fever. Which association is correct?',['Wind—atelectasis or pneumonia','Water—wound dehiscence','Walking—UTI','Wounded—DVT'],0,'Remember Wind (atelectasis/pneumonia), Water (UTI), Walking (DVT/PE), and Wounded (incisional infection).'],
['Sterilization','Which teaching is essential after a vasectomy or tubal ligation?',['It provides STI protection','It is easily reversible','It is permanent and does not prevent STIs','It is effective immediately for all clients'],2,'Vasectomy and tubal ligation are permanent methods with failure rates under 1%, but neither protects against STIs.'],
['Hysterectomy','Which action is contraindicated after hysterectomy?',['Monitoring vaginal bleeding','Encouraging ambulation','Massaging the fundus','Using SCDs until ambulating'],2,'There is no uterus after hysterectomy, so fundal massage is not appropriate. Monitor vaginal bleeding instead.'],
['Pelvic Organ Prolapse','Which instruction should the nurse include for a client with pelvic organ prolapse?',['Perform 8 to 12 Kegels three times each day','Restrict all oral fluids','Begin heavy lifting to strengthen muscles','Avoid discussing symptoms'],0,'First-line management includes pelvic floor exercises, weight loss when appropriate, and avoiding constipation, straining, and heavy lifting.'],
['Urinary Incontinence','A client leaks urine when laughing and coughing. Which type of incontinence is most likely?',['Urge','Stress','Functional','Overflow'],1,'Stress incontinence occurs with increased abdominal pressure, such as coughing, laughing, sneezing, or lifting.'],
['Urinary Incontinence','Which finding is most consistent with urge incontinence?',['Leakage only with lifting','Strong sudden urge with nocturia','Inability to reach the toilet because of immobility','Fecal drainage from the vagina'],1,'Urge incontinence involves a sudden strong urge that cannot be held and may include nocturia.'],
['Benign Growths','Which assessment finding is expected with uterine fibroids?',['Heavy or painful periods and pelvic fullness','Painless mass under the areola','Bleeding only after menopause','Urine from the vagina after labor'],0,'Fibroids are estrogen responsive and may cause heavy/painful menses, pelvic fullness, urinary frequency, and infertility.'],
['Reproductive Cancer','Which symptom should prompt evaluation for ovarian cancer?',['Persistent bloating and early fullness','Brief menstrual cramping','A single hot flash','Improved appetite'],0,'Ovarian cancer often has vague early symptoms such as persistent bloating, early satiety, urinary frequency, and bowel changes.'],
['Cervical Cancer','Which statement about cervical cancer is accurate?',['HPV infection must be present','It is diagnosed with a DEXA scan','Pap screening begins at age 12','It never occurs with HIV'],0,'HPV is required for cervical cancer. Risk is higher with HIV, and Pap screening begins at age 21.'],
['Breast Health','Which statement about breast cancer screening is accurate?',['Mammography is the gold standard','Breast self-exam replaces mammography','Men cannot develop breast cancer','Only pain indicates cancer'],0,'Mammography is the screening gold standard. Male breast cancer may present as a painless, firm mass under the areola.'],
['Family Structure','A family consists of two households after divorce with shared custody of children. How should the nurse classify the family?',['Nuclear','Binuclear','Blended','Foster'],1,'Binuclear families involve two households after divorce or separation with shared custody.'],
['Parenting','Which behavior describes authoritative parenting?',['Warmth with consistent rules and reasoning','High control with punishment and little support','No rules or discipline','No emotional involvement'],0,'Authoritative parenting combines warmth, fair consistent limits, and reasoning; it supports independence and social responsibility.'],
['Culture and Care','Which nursing action best demonstrates culturally responsive care?',['Assume all members of a group share the same beliefs','Assess the client’s own beliefs and decision makers','Avoid asking about herbal remedies','Ignore nonverbal pain cues'],1,'Cultural patterns are not rules. Assess each individual’s beliefs, family decision makers, practices, and preferences.'],
['Religion and Care','Which meal request should the nurse anticipate for a Muslim client?',['Halal food','Mandatory pork at breakfast','Alcohol with meals','No fluids ever'],0,'Muslim clients may request halal foods and fasting during Ramadan can affect the care plan.'],
['Client Rights','A competent adult refuses recommended treatment. What is the nurse’s best action?',['Force treatment','Notify the provider, confirm understanding, and support the decision','Ask family to override the client','Document refusal and leave immediately'],1,'Competent adults may refuse treatment. Ensure informed understanding, notify the provider, document, and support the decision.'],
['Historical Perspectives','Which change contributed substantially to improved child health and survival?',['Development of antibiotics and vaccines','Avoiding evidence-based research','Eliminating prenatal care','Reducing infection control'],0,'Antibiotics, vaccines, and medical advances have greatly improved child health and survival.'],
['Maternal Health','Which condition is a leading cause of pregnancy-related mortality?',['Hemorrhage','Osteoarthritis','Cataracts','Appendicitis only'],0,'Leading causes include hemorrhage, infection, preeclampsia-eclampsia, obstructed labor, and unsafe abortion.'],
['Contraception','Which client statement about sterilization requires correction?',['It is intended to be permanent','It does not protect against STIs','It has a failure rate under 1%','It protects against HIV and other STIs'],3,'Sterilization does not protect against HIV or other STIs; barrier protection is still needed when indicated.']
];
bank.push(
['Cesarean Birth Scenario','A client is 1 hour after a cesarean birth. Which findings require immediate nursing follow-up? Select all that apply.',['Saturated perineal pad in 15 minutes','Urine output of 15 mL/hr','Pain rated 4/10 after analgesia','Boggy fundus with continued bleeding','Pulse 118/min'],[0,1,3,4],'After cesarean birth, assess fundus, bleeding, urine output, and pain closely. Heavy bleeding, a boggy fundus, oliguria, and tachycardia can signal postpartum hemorrhage or hypovolemia.'],
['Hysterectomy Scenario','A client is being discharged after a hysterectomy. Which instructions should the nurse include? Select all that apply.',['Walk frequently','Avoid vaginal intercourse, tampons, and douching for 6 weeks','Call for fever of 100.4 F or higher','Lift more than 10 pounds to rebuild strength','Avoid driving while taking prescription opioids'],[0,1,2,4],'After hysterectomy, teach frequent ambulation, nothing in the vagina for 6 weeks, no driving with opioids, lifting limits, and prompt reporting of fever, heavy bleeding, chest pain, leg pain, or urinary problems.'],
['Pelvic Organ Prolapse Scenario','A 63-year-old client reports a vaginal bulge, pelvic pressure, and urinary leakage when coughing. Which teaching is appropriate? Select all that apply.',['Perform pelvic floor exercises regularly','Avoid constipation and heavy lifting','Use a pessary if prescribed','Restrict fluids to 250 mL/day','Weight loss may reduce pelvic stress'],[0,1,2,4],'Pelvic organ prolapse management includes Kegels, avoiding strain and heavy lifting, weight management when appropriate, and pessary support. Severe fluid restriction is not appropriate.'],
['Menopause Scenario','A perimenopausal client reports hot flashes and asks what may worsen them. Which items should the nurse identify as common triggers? Select all that apply.',['Caffeine','Spicy foods','Alcohol','Cool cloths','Tight clothing'],[0,1,2,4],'Common hot-flash triggers include caffeine, smoking, spicy food, alcohol, tight clothing, stress, and heat. Cooling measures can help relieve symptoms.'],
['Incontinence Scenario','A nurse is teaching a client with urge urinary incontinence. Which interventions should be included? Select all that apply.',['Keep a bladder diary','Practice bladder training','Avoid caffeine and carbonated beverages','Restrict fluids to prevent all leakage','Treat chronic cough and constipation'],[0,1,2,4],'Assessment and management include a voiding history, bladder diary, bladder training, avoiding irritants, adequate fluids, fiber, and treatment of chronic cough or constipation.'],
['Culture and Care Scenario','A hospitalized client uses herbal tea and prayer during illness and has a low pain rating despite grimacing. Which nursing actions are appropriate? Select all that apply.',['Ask about the herbal remedy and notify the provider/pharmacist of possible interactions','Respect safe spiritual practices','Assess pain using nonverbal cues as well as the rating','Assume the client does not need pain relief','Require the client to stop all cultural practices'],[0,1,2],'Culturally responsive care assesses individual beliefs and practices, supports safe rituals, reports herb use for interaction screening, and considers nonverbal pain cues.'],
['Osteoporosis Scenario','A 70-year-old client with osteoporosis is receiving discharge teaching. Which statements indicate understanding? Select all that apply.',['I will do weight-bearing exercise as tolerated','I will use fall-prevention strategies at home','I will limit smoking and alcohol','I should stop calcium and vitamin D','I should discuss proper bisphosphonate use with my provider'],[0,1,2,4],'Prevention and management include calcium, vitamin D, weight-bearing exercise, fall prevention, no smoking, limited alcohol, and safe medication teaching.']
);
bank.push(
['Family Structure Scenario','A client says, “My ex-spouse and I live separately but share custody of our children.” Which family structure should the nurse document?',['Nuclear','Binuclear','Blended','Foster'],1,'A binuclear family has two households following separation or divorce, with shared custody of children.'],
['Family Structure SATA','Which statements about family structures are accurate? Select all that apply.',['A blended family includes parents and stepchildren','Foster care is intended to be temporary','Adoption is a legal, permanent relationship','A nuclear family always includes grandparents in the household','Grandparents may become primary parents'],[0,1,2,4],'Family assessment identifies the client’s actual support system and the primary caregiver, not assumptions based on household labels.'],
['Parenting Scenario','A parent is warm, explains consequences, gives age-appropriate choices, and enforces rules consistently. Which parenting style is demonstrated?',['Authoritarian','Authoritative','Permissive','Uninvolved'],1,'Authoritative parenting combines warmth, consistent limits, and reasoning. It is associated with independence, self-confidence, and social responsibility.'],
['Parent Teaching SATA','Which teaching should the nurse give a parent who wants to improve discipline? Select all that apply.',['Set clear, age-appropriate expectations','Explain consequences at the child’s level','Give consequences soon after the behavior','Stay calm and firm rather than angry','Withhold praise so the child does not become dependent'],[0,1,2,3],'Effective parent teaching uses clear expectations, timely consistent consequences, calm follow-through, choices when appropriate, and praise for desired behavior.'],
['Child Safety Scenario','During an assessment, a child has injuries inconsistent with the caregiver’s explanation. What is the nurse’s priority action?',['Confront the caregiver and demand an explanation','Report suspected abuse according to agency policy','Wait until the child confirms abuse','Ask another family member to investigate'],1,'The nurse does not need proof to report suspected abuse. Follow agency and mandated-reporting policy, document objective findings, and protect the child.'],
['Culture and Decision Making','A hospitalized client’s family asks to participate in health decisions. What is the nurse’s best action?',['Assume the eldest male makes all decisions','Ask the client whom they want involved in decisions','Exclude the family to protect confidentiality','Use cultural stereotypes to predict preferences'],1,'Cultural patterns are not rules. Ask each client who they want involved in decisions and obtain permission before sharing health information.'],
['Religion and Care SATA','Which nursing actions appropriately accommodate religious beliefs when safe? Select all that apply.',['Arrange halal food for a Muslim client who requests it','Ask about fasting during Ramadan when planning medications and meals','Support prayer or spiritual healing practices that do not create harm','Offer a lacto-vegetarian option for a Hindu client who requests it','Tell every client that religious practices must stop during hospitalization'],[0,1,2,3],'Respectful care accommodates safe dietary, prayer, and spiritual practices. Collaborate with the individual client rather than assuming beliefs.'],
['Infertility Definitions','Which client history is consistent with secondary infertility?',['Never conceived after 12 months of unprotected intercourse','Unable to conceive after a prior successful pregnancy','No menses by age 16 with secondary sex characteristics','Painful menses caused by prostaglandins'],1,'Secondary infertility is inability to conceive after a previous successful pregnancy. Primary infertility is inability to conceive after 1 year of unprotected intercourse without a prior pregnancy.'],
['Infertility Testing','A client asks which test evaluates whether the fallopian tubes are open. Which response is correct?',['Semen analysis','Hysterosalpingogram','DEXA scan','Pap smear'],1,'A hysterosalpingogram is the standard test for tubal patency. Semen analysis evaluates the male partner; laparoscopy visualizes the pelvis and can diagnose endometriosis.'],
['Clomiphene Teaching','Which statement by a client prescribed clomiphene indicates understanding?',['“This medication induces ovulation, and multiple pregnancy is possible.”','“I should use it continuously throughout pregnancy.”','“It cures tubal blockage.”','“It has no effect on ovarian follicles.”'],0,'Clomiphene induces ovulation and can result in multiple gestation. It does not cure tubal obstruction and is generally limited to a small number of cycles.'],
['Assisted Reproduction','Which procedure is most appropriate for severe male-factor infertility when a single sperm is injected into an egg?',['IVF','ICSI','GIFT','Hysterosalpingogram'],1,'Intracytoplasmic sperm injection (ICSI) injects one sperm into an egg and is used for male-factor infertility. IVF may be used for tubal disease, endometriosis, or low sperm count.'],
['Amenorrhea and Dysmenorrhea','Which finding is consistent with primary amenorrhea?',['No menses for three cycles after previously regular periods','No menses by age 16 despite secondary sex characteristics','Pain with menses caused by pelvic infection','Bleeding lasting more than seven days during perimenopause'],1,'Primary amenorrhea is absence of menses by age 14 without secondary sex characteristics or by age 16 with them. Secondary amenorrhea occurs after previously established menses.'],
['Endometriosis Teaching','Which plan should the nurse anticipate for a client with endometriosis?',['Estrogen stimulation only','NSAIDs, hormonal suppression, or surgery as indicated','Immediate mastectomy','Long-term antibiotic treatment for HSV'],1,'Endometriosis treatment aims to relieve pain and suppress cycling tissue; options include NSAIDs, oral contraceptives, Depo-Provera, GnRH agonists, and surgery.'],
['PCOS Scenario','Which assessment findings support polycystic ovary syndrome? Select all that apply.',['Hirsutism','Irregular or absent periods','Anovulation and infertility','Insulin resistance','Low risk for endometrial cancer'],[0,1,2,3],'PCOS is associated with elevated androgens, insulin resistance, anovulation, irregular menses, obesity, infertility, diabetes, metabolic syndrome, and endometrial cancer risk.'],
['PID Scenario','A client has lower abdominal pain, fever, and cervical motion tenderness. Which complication should the nurse discuss if pelvic inflammatory disease is untreated?',['Tubal scarring and infertility','Improved ovarian reserve','Osteoporosis','Cataracts'],0,'PID can damage the fallopian tubes, increasing the risk for infertility and ectopic pregnancy. Prompt treatment and STI prevention teaching are essential.'],
['Menopause Red Flags','Which perimenopausal finding requires provider follow-up?',['A hot flash relieved by a cool cloth','Bleeding that soaks a pad every hour','Mild vaginal dryness relieved by lubricant','A brief mood change during a stressful week'],1,'Report bleeding that soaks a pad every 1 to 2 hours, lasts longer than 7 days, occurs between periods, or happens with cycles regularly shorter than 21 days.'],
['Hormone Therapy','A menopausal client with an intact uterus is prescribed systemic estrogen. Which additional medication does the nurse expect?',['A progestin','An antibiotic','RhoGAM','An anticholinergic'],0,'Clients with a uterus need progestin with systemic estrogen to lower the risk of endometrial cancer. Review cardiovascular and breast-cancer risks and nonhormonal options when appropriate.'],
['Osteoporosis Medications','Which instruction is appropriate for a client taking an oral bisphosphonate?',['Take it with water and follow the prescribed upright-position instructions','Take it at bedtime with a large meal','Stop calcium and vitamin D permanently','Expect it to treat an acute hip fracture immediately'],0,'Bisphosphonate teaching includes correct administration, adequate calcium/vitamin D when appropriate, weight-bearing exercise, and fall prevention. Follow the specific drug instructions to reduce esophageal irritation.'],
['Abortion Nursing Care SATA','A Rh-negative client is having an abortion. Which nursing actions are appropriate? Select all that apply.',['Anticipate RhoGAM as prescribed','Explain that misoprostol causes uterine contractions','Monitor for hemorrhage, infection, retained tissue, and perforation after a surgical procedure','Provide unbiased information and arrange transfer of care if a nurse declines participation','Tell the client that they must continue care with a nurse who objects'],[0,1,2,3],'Rh-negative clients receive RhoGAM before medical or surgical abortion. Nurses provide nonjudgmental, unbiased care and ensure safe transfer if they cannot participate.'],
['Cesarean Discharge SATA','Which findings indicate readiness for discharge after cesarean birth? Select all that apply.',['Tolerating food','Voiding adequately','Passing flatus','Walking with assistance or independently as appropriate','Unable to keep liquids down'],[0,1,2,3],'Before discharge, the client should tolerate intake, void well, pass flatus, ambulate, and understand warning signs. Teach to report heavy bleeding, calf pain, purulent drainage, separation, severe headache/vision changes, or RUQ pain.'],
['Hysterectomy Scenario','A client reports shoulder discomfort after laparoscopic hysterectomy. Which response is best?',['“This can occur from the gas used during surgery and may last several days.”','“This means you are hemorrhaging internally.”','“Massage your fundus to relieve the pain.”','“You should remain on strict bed rest.”'],0,'Shoulder pain after laparoscopy can result from residual gas and may last up to about 7 days. Continue to assess for abnormal symptoms and encourage appropriate ambulation.'],
['Pelvic Organ Prolapse','Which statement correctly matches the prolapse with the structure involved?',['Cystocele: bladder into the anterior vaginal wall','Rectocele: uterus into the vaginal canal','Enterocele: bladder into the anterior vaginal wall','Uterine prolapse: rectum into the posterior vaginal wall'],0,'A cystocele involves the bladder/anterior wall; rectocele involves the rectum/posterior wall; enterocele involves small intestine; uterine prolapse involves the uterus descending into the vaginal canal.'],
['Incontinence Types','A client’s urinary tract is functioning normally, but arthritis prevents reaching the toilet in time. Which incontinence type is present?',['Stress','Urge','Functional','Overflow'],2,'Functional incontinence occurs when cognitive or physical limitations prevent timely toileting despite a normally functioning urinary tract.'],
['Incontinence Medication','Which adverse effect should the nurse teach a client taking oxybutynin or tolterodine to expect?',['Dry mouth, blurred vision, and constipation','Increased salivation and diarrhea','Vaginal bleeding and fever','Improved bone density'],0,'Anticholinergics for urge incontinence can cause dry mouth, blurred vision, and constipation. Reinforce fluids/fiber as appropriate and safety precautions.'],
['Benign Growths','A client reports urine leaking from the vagina after prolonged labor. Which condition should the nurse suspect?',['Fistula','Fibroid','Ovarian cyst','Polyp'],0,'A fistula can cause urine or stool to pass through the vagina, often after prolonged labor or pelvic surgery. This requires prompt evaluation.'],
['Breast and Reproductive Cancer SATA','Which teaching points are appropriate? Select all that apply.',['Persistent bloating and early fullness should be evaluated for ovarian cancer','HPV infection is required for cervical cancer to develop','Mammography is the screening gold standard','After mastectomy, perform prescribed arm exercises and avoid heavy lifting','A painless firm mass beneath the areola can occur with male breast cancer'],[0,1,2,3,4],'Cancer teaching includes early evaluation of warning signs, HPV/Pap screening knowledge, mammography, mastectomy arm care, and recognition that male breast cancer can present as a painless firm subareolar mass.']
);
bank.push(
['Parenting Styles','Which parent behavior is characteristic of permissive parenting?',['Strict obedience with punishment and little warmth','Warmth with fair, consistent rules','Few limits and lax discipline','Little emotional involvement or guidance'],2,'Permissive parenting has few or unclear limits and lax discipline. Authoritarian is high control/low support, authoritative is warm with consistent limits, and uninvolved is disconnected with little guidance.'],
['Cultural Health Practices','A client says, “I use an herbal remedy and a healing ceremony to restore balance.” Which nursing response is best?',['“Stop using all traditional practices.”','“Tell me how you use it so we can check for safety and interactions.”','“Traditional practices are never compatible with health care.”','“I will document that you refuse Western care.”'],1,'Ask about the individual’s practices without judgment. Support safe rituals and report herb use for interaction screening; never assume that complementary practices mean the client rejects medical care.'],
['Religious Care','Which client request should the nurse anticipate? Select all that apply.',['A Christian Science client may prefer prayer or spiritual healing','A Mormon client may avoid alcohol, tobacco, and caffeine','A Roman Catholic family may request baptism for a critically ill newborn','A Hindu client may request an Ayurvedic remedy or lacto-vegetarian diet','Every client who identifies with a faith will make the same health decision'],[0,1,2,3],'Religious preferences vary within every faith. Ask the individual client, honor safe requests, and work with the care team to accommodate practices whenever possible.'],
['Infertility Risk Factors','Which factor can contribute to male infertility?',['Frequent hot-tub use','Routine mammography','Taking calcium with vitamin D','A Pap smear at age 21'],0,'Heat exposure to the genitals, smoking, heavy alcohol use, toxins, obesity, mumps after puberty, and undescended testes can contribute to male infertility.'],
['Amenorrhea Causes','A client with secondary amenorrhea asks about possible causes. Which response is accurate?',['“Pregnancy, stress, vigorous exercise, rapid weight change, thyroid disease, and hyperprolactinemia can contribute.”','“Amenorrhea is always caused by ovarian cancer.”','“Amenorrhea never needs evaluation.”','“Only an STI can cause missed periods.”'],0,'Evaluate the cause of secondary amenorrhea. Treatment matches the cause, such as nutritional support, thyroid replacement, bromocriptine for hyperprolactinemia, or hormonal treatment for anovulation.'],
['Osteoporosis Assessment','Which finding is commonly associated with osteoporosis?',['Silent disease until a wrist or hip fracture','Painless firm breast mass under the areola','Heavy menstrual bleeding caused by fibroids','Sudden urge to void with nocturia'],0,'Osteoporosis is often silent until a fracture. Loss of height, posture changes, and low back pain may also occur.'],
['Cesarean Indications','Which condition may require cesarean birth?',['Cord prolapse','Uncomplicated hot flash','Stress incontinence','Osteopenia'],0,'Common cesarean indications include cord prolapse, placenta previa, macrosomia, breech/transverse lie, nonreassuring fetal status, active HSV/HIV, failed induction, and arrest of labor.'],
['Cesarean Warning Signs SATA','Which findings should a client report after discharge following cesarean birth? Select all that apply.',['Bleeding greater than one pad per hour','Golf-ball-size clots','Calf tenderness','Purulent incision drainage or wound separation','Headache with vision changes or right-upper-quadrant pain'],[0,1,2,3,4],'These findings can indicate hemorrhage, thromboembolism, infection, wound complication, or postpartum hypertensive emergency and require prompt evaluation.'],
['Hysterectomy Discharge','Which client statement after hysterectomy requires follow-up teaching?',['“I will call for fever or foul discharge.”','“I will avoid intercourse and tampons for six weeks.”','“I can drive while taking opioids if I feel alert.”','“I will walk frequently and avoid constipation.”'],2,'Do not drive while taking prescription opioids. Reinforce lifting limits, nothing in the vagina for 6 weeks, ambulation, constipation prevention, and prompt reporting of fever, heavy bleeding, chest/leg pain, or urinary problems.'],

bank.push(
['Family Structure Scenario','A nurse is preparing discharge teaching for a child who lives in two homes after the parents divorced and share custody. Which action is best?',['Classify the family as nuclear','Ask which caregivers make health decisions in each household','Teach only the parent who brought the child today','Assume the stepparent has legal authority'],1,'A binuclear family has two households after divorce or separation. Assess the child’s actual caregivers and decision makers so teaching reaches the appropriate people.'],
['Family Structures','Which statement about family structures is accurate?',['Foster care is always permanent','Adoption is a temporary placement','A blended family includes parents and stepchildren','A single-parent family cannot include an adopted child'],2,'A blended family includes parents and stepchildren. Foster care is temporary, adoption is legal and permanent, and single-parent families may form through adoption, separation, divorce, or death.'],

['Culture and Care','Which assessment best reflects understanding of Asian American health beliefs described in the lecture?',['Ask whether the client uses yin-yang balance practices with Western care','Assume all clients refuse modern care','Tell the client complementary practices are ineffective','Avoid discussing family pride or dignity'],0,'Some Asian American clients may value balance of yin and yang and use complementary therapies with Western care. Individual assessment prevents stereotyping.'],
['Culture and Care','A Hispanic client quietly grimaces but rates pain as 2/10 and reports using a folk remedy. What should the nurse do?',['Document no pain because the rating is low','Assess nonverbal cues and ask about the remedy','Tell the client folk remedies are forbidden','Assume the client is exaggerating'],1,'Pain may be borne stoically in some cultures. Assess both verbal and nonverbal cues and ask about remedies without judgment.'],

['Religion and Care','Which requests should the nurse anticipate? Select all that apply.',['A Hindu client may request a lacto-vegetarian meal','A Muslim client may request halal food','A Mormon client may avoid alcohol, tobacco, and caffeine','A Roman Catholic family may request baptism for a dying newborn','All clients from a religion follow the same practices'],[0,1,2,3],'Accommodate safe individual religious practices. Ask rather than assume; beliefs and adherence vary within every religious group.'],
['Infertility','Which couple meets the definition of primary infertility?',['A couple unable to conceive after 12 months of unprotected intercourse and never pregnant','A client with irregular periods for 2 months','A couple unable to conceive after a previous pregnancy','A client who has had one miscarriage'],0,'Primary infertility is inability to conceive after 1 year of unprotected intercourse with no prior pregnancy. Secondary infertility follows a previous successful pregnancy.'],
['Infertility Testing','A client asks which test checks whether the fallopian tubes are open. Which response is correct?',['Semen analysis','Hysterosalpingogram','Pap test','DEXA scan'],1,'A hysterosalpingogram is the gold-standard test for tubal patency. Semen analysis evaluates the male partner and is usually completed first because it is simple and inexpensive.'],
['Infertility Treatment Scenario','A client takes clomiphene to induce ovulation. Which teaching should the nurse include? Select all that apply.',['Multiple births are possible','Intercourse every other day for 1 week after day 5 may be advised','The medication permanently blocks ovulation','Treatment is commonly stopped after several unsuccessful cycles'],[0,1,3],'Clomiphene induces ovulation; multiple gestation is possible. Teaching commonly includes timed intercourse after the medication and limiting treatment cycles as prescribed.'],
['Assisted Reproduction','Which intervention is most appropriate for severe male-factor infertility?',['ICSI','Pap smear','Pessary fitting','Endometrial biopsy'],0,'Intracytoplasmic sperm injection (ICSI) is used for male-factor infertility. IVF may be used for tubal blockage, endometriosis, or low sperm count.'],
['Amenorrhea','Which finding supports primary amenorrhea?',['No menses for 3 cycles after prior regular periods','No menses by age 16 despite secondary sex characteristics','Painful menses for 48 hours','Heavy bleeding after intercourse'],1,'Primary amenorrhea is no menses by age 14 without secondary sex characteristics or by age 16 with them. Secondary amenorrhea follows previously established menses.'],
['Menstrual Disorders','A client has primary dysmenorrhea. Which explanation is accurate?',['Pain is caused by excess prostaglandins and begins with bleeding','It always indicates cancer','Pain occurs only after menopause','It is caused by a fistula'],0,'Primary dysmenorrhea is associated with excess prostaglandins and pain that begins with menstruation and lasts about 48 to 72 hours. Secondary dysmenorrhea is due to pelvic disease.'],
['Amenorrhea Scenario','A client with amenorrhea has marked weight loss from an eating disorder. What is the priority intervention?',['Nutritional counseling and treatment of the underlying cause','Immediate hysterectomy','Long-term antibiotics','Avoiding all exercise forever'],0,'Amenorrhea treatment is directed at its cause. Nutritional counseling is appropriate when disordered eating or rapid weight change contributes.'],
['Endometriosis','Which treatment approach is expected for endometriosis?',['Suppress estrogen/progesterone with options such as OCs or GnRH agonists','Use antibiotics as the only treatment','Encourage pregnancy testing only','Avoid NSAIDs for pain'],0,'Endometriosis treatment may include NSAIDs, OCs, Depo-Provera, GnRH agonists, or surgery to suppress hormonal stimulation and manage pain.'],
['PID and STIs','Which teaching is a priority for a client being treated for pelvic inflammatory disease?',['Stop antibiotics when pain improves','Complete prescribed antibiotics and ensure partners are evaluated/treated','Use douches to prevent recurrence','Delay care for fever and pelvic pain'],1,'PID requires prompt treatment to reduce infertility and ectopic-pregnancy risk. Teach completion of antibiotics, partner evaluation/treatment, safer sex, and urgent reporting of worsening symptoms.'],
['PCOS Scenario','Which findings are consistent with PCOS? Select all that apply.',['Hirsutism','Irregular or absent periods','Anovulation','Increased risk for type 2 diabetes','Low insulin levels'],[0,1,2,3],'PCOS is associated with insulin resistance, high androgens/hirsutism, anovulation, irregular menses, obesity, infertility, and increased type 2 diabetes and endometrial-cancer risk.'],
['Menopause Teaching','Which perimenopausal finding should the client report promptly?',['One hot flash after coffee','Bleeding that soaks a pad every hour','Mild vaginal dryness','A brief mood change'],1,'Report bleeding that soaks a pad every 1 to 2 hours, lasts more than 7 days, occurs between periods, or has cycles regularly shorter than 21 days.'],
['Hormone Therapy','A menopausal client with an intact uterus receives systemic estrogen. Which additional medication does the nurse anticipate?',['A progestin','RhoGAM','An antibiotic','An anticholinergic'],0,'When the uterus is intact, a progestin is added to systemic estrogen to reduce endometrial-cancer risk from unopposed estrogen.'],
['Osteoporosis','Which finding may indicate osteoporosis before a fracture occurs?',['Loss of height and posture changes','Elevated FSH only','Vaginal discharge','Hot flashes after caffeine'],0,'Osteoporosis is often silent until a hip or wrist fracture. Loss of height, posture change, and low back pain can occur.'],
['Osteoporosis Teaching','Which statements indicate understanding of bone-health teaching? Select all that apply.',['Leafy greens provide vitamin K that supports bone health','Excess soda, caffeine, and sodium can increase calcium loss','Smoking supports bone density','Bisphosphonates may be prescribed','Long-term levothyroxine can speed bone loss'],[0,1,3,4],'Teach calcium/vitamin D, weight-bearing activity, fall prevention, no smoking, limited alcohol, and medication safety. Excess soda/caffeine/sodium and long-term levothyroxine can contribute to bone loss.'],
['Abortion Care','A client who is Rh-negative is scheduled for a medical abortion. Which medication should the nurse anticipate?',['RhoGAM','Oxytocin only','Insulin','Naloxone'],0,'Rh-negative clients should receive RhoGAM before medical or surgical abortion to prevent Rh sensitization.'],
['Abortion Care','Which statements about abortion care are accurate? Select all that apply.',['Misoprostol causes uterine contractions','Surgical risks include infection, hemorrhage, retained tissue, and uterine perforation','A nurse who declines participation must ensure unbiased information and transfer care','The nurse should shame the client into changing the decision'],[0,1,2],'Medical abortion commonly includes mifepristone or methotrexate followed by misoprostol. Nurses provide nonjudgmental care; a nurse who declines participation must ensure a safe transfer of care.'],
['Cesarean Discharge','Which finding indicates readiness for discharge after a cesarean birth?',['Tolerating food, voiding well, and passing flatus','Ongoing ileus and abdominal distention','Unable to ambulate at all','No urine output after Foley removal'],0,'Before discharge after cesarean birth, the client should tolerate food, void adequately, pass flatus, ambulate, and have no evidence of infection, hemorrhage, or thromboembolism.'],
['Cesarean Discharge Scenario','Which symptoms should a client report after cesarean birth? Select all that apply.',['Bleeding greater than one pad per hour','Calf tenderness','Purulent incision drainage','Golf-ball-size clots','Mild hunger after walking'],[0,1,2,3],'After cesarean birth, report heavy bleeding, large clots, calf pain/tenderness, purulent drainage, wound separation, fever, headache with visual changes or RUQ pain, and respiratory symptoms.'],

let pool=[],index=0,correct=0,streak=0,selected=[];
const el=id=>document.getElementById(id);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function optionReason(q,option){
 const s=option.toLowerCase();
 if(s.includes('restrict fluids'))return 'Fluid restriction is generally not the first-line answer. Teach adequate hydration unless a specific medical order requires restriction; concentrated urine can irritate the bladder and worsen symptoms.';
 if(s.includes('heavy lifting'))return 'Heavy lifting increases intra-abdominal pressure. This can worsen pelvic floor symptoms and is unsafe during recovery after pelvic surgery.';
 if(s.includes('stop all cultural')||s.includes('assume the client'))return 'Avoid assumptions. Nursing care should assess the individual client, respect safe beliefs and practices, and still provide a complete pain and safety assessment.';
 if(s.includes('massage the fundus'))return 'Fundal massage is a postpartum intervention when a uterus is present. After hysterectomy, assess the incision, vaginal bleeding, vital signs, and urine output instead.';
 if(s.includes('sti protection')||s.includes('protects against hiv'))return 'Sterilization prevents pregnancy but does not prevent HIV or other STIs. Recommend barrier protection when infection prevention is needed.';
 if(s.includes('reversible')||s.includes('effective immediately'))return 'Sterilization is intended to be permanent. A vasectomy requires another contraceptive method until follow-up semen analysis confirms azoospermia.';
 if(s.includes('force treatment')||s.includes('override'))return 'A competent adult has the right to refuse treatment. The nurse verifies informed understanding, notifies the provider, documents, and supports the client’s decision.';
 if(s.includes('hysterosalpingogram')||s.includes('laparoscopy'))return 'These evaluate female reproductive anatomy. A semen analysis is the initial, noninvasive evaluation for the male partner.';
 if(s.includes('primary amenorrhea'))return 'Primary amenorrhea refers to delayed onset of menstruation. This client previously had regular menses, so absence for three cycles is secondary amenorrhea.';
 if(s.includes('painless heavy bleeding')||s.includes('breast mass')||s.includes('urge to void'))return 'This finding does not match the expected pattern for the condition in the stem. Match the assessment data with the defining symptom cluster before selecting an answer.';
 if(s.includes('vaginal birth')||s.includes('oxytocin induction'))return 'With active genital HSV lesions at labor onset, vaginal birth can expose the newborn to HSV. Cesarean birth is anticipated to reduce neonatal exposure.';
 if(s.includes('fsh decreases')||s.includes('hysterectomy always'))return 'During natural menopause, estrogen decreases and FSH rises. Hysterectomy alone does not necessarily cause menopause if ovarian function remains.';
 if(s.includes('t-score of -1.0'))return 'A T-score of -1.0 is normal. Osteopenia is between -1.0 and -2.5; osteoporosis is -2.5 or lower.';
 if(s.includes('visual acuity')||s.includes('breast self-exam')||s.includes('fasting blood'))return 'This does not address immediate postoperative priorities. First assess circulation and complications: fundus, bleeding, urine output, vital signs, and pain.';
 if(s.includes('wound dehiscence')||s.includes('uti')||s.includes('dvt'))return 'Use the postoperative fever pattern: Wind = atelectasis/pneumonia, Water = UTI, Walking = DVT/PE, Wound = incisional infection.';
 if(s.includes('restrict all oral fluids')||s.includes('avoid discussing'))return 'Restricting fluids and avoiding discussion do not promote symptom management. Teach pelvic floor care, prevention of constipation/straining, and prompt evaluation of worsening symptoms.';
 if(s.includes('urge')||s.includes('functional')||s.includes('overflow'))return 'Match the trigger to the type: leakage with coughing or laughing is stress incontinence caused by increased intra-abdominal pressure.';
 if(s.includes('leakage only with lifting')||s.includes('immobility')||s.includes('fecal drainage'))return 'A sudden irresistible urge with nocturia is urge incontinence. The other choices describe stress, functional, or a possible fistula-related concern.';
 if(s.includes('painless mass')||s.includes('bleeding only after menopause')||s.includes('urine from'))return 'This does not fit uterine fibroids. Fibroids commonly cause heavy or painful menses, pelvic fullness, urinary frequency, and possible infertility.';
 if(s.includes('brief menstrual cramping')||s.includes('single hot flash')||s.includes('improved appetite'))return 'These are not concerning ovarian-cancer patterns. Persistent bloating, early satiety, pelvic/abdominal pain, urinary changes, or bowel changes need evaluation.';
 if(s.includes('dexa')||s.includes('age 12')||s.includes('never occurs'))return 'DEXA evaluates bone density, not cervical disease. Cervical cancer is HPV-related, screening begins at 21, and risk increases with immunosuppression such as HIV.';
 if(s.includes('self-exam replaces')||s.includes('men cannot')||s.includes('only pain'))return 'Mammography is the screening standard. Self-awareness does not replace screening, men can develop breast cancer, and masses may be painless.';
 if(s.includes('nuclear')||s.includes('blended')||s.includes('foster'))return 'Shared custody in two homes after separation is a binuclear family. Use the client’s stated family structure rather than assumptions.';
 if(s.includes('punishment')||s.includes('no rules')||s.includes('no emotional'))return 'Authoritative parenting is warm and responsive while maintaining fair, consistent boundaries and explanations.';
 if(s.includes('assume all')||s.includes('avoid asking')||s.includes('ignore nonverbal'))return 'Culturally responsive nursing starts with individualized assessment. Ask about practices and remedies, and consider verbal and nonverbal pain behaviors.';
 if(s.includes('pork')||s.includes('alcohol')||s.includes('no fluids'))return 'Muslim dietary practices may include halal food and avoidance of pork and alcohol. Collaborate with the client about individual preferences and fasting.';
 if(s.includes('evidence-based')||s.includes('eliminating prenatal')||s.includes('reducing infection'))return 'Improvements in survival followed advances such as vaccines, antibiotics, infection control, research, and prenatal care—not their removal.';
 if(s.includes('osteoarthritis')||s.includes('cataracts')||s.includes('appendicitis'))return 'Pregnancy-related mortality priorities include hemorrhage, infection, hypertensive disorders, thromboembolism, obstructed labor, and unsafe abortion.';
 if(s.includes('pain rated 4'))return 'A pain score of 4 after analgesia warrants reassessment and comfort measures, but heavy bleeding, oliguria, a boggy fundus, and tachycardia are immediate physiologic priorities.';
 if(s.includes('cool cloths'))return 'Cooling measures can relieve hot flashes; they are not a typical trigger. Teach clients to avoid personal triggers such as caffeine, alcohol, heat, and spicy foods.';
 if(s.includes('stop calcium'))return 'Calcium and vitamin D support bone health when appropriate. Reinforce medication, nutrition, weight-bearing activity, and fall-prevention teaching.';
 return `This option is less appropriate because it does not address the priority assessment, safety concern, or evidence-based teaching in this clinical situation. Re-focus on the key cue: ${q[4]}`;
}
function start(){pool=[...bank].sort(()=>Math.random()-.5);index=0;correct=0;streak=0;el('game').style.display='block';el('summary').style.display='none';show()}
function show(){const q=pool[index],sata=Array.isArray(q[3]);selected=[];el('progress').textContent=`Question ${index+1} of ${pool.length}`;el('progressFill').style.width=`${Math.round(index/pool.length*100)}%`;el('level').textContent=`Level: ${streak>=2?'Challenge ✦':streak<0?'Review ↻':'Building'}`;el('score').textContent=`Correct: ${correct}`;el('topic').textContent=q[0]+(sata?' • Select all that apply':'');el('question').textContent=q[1];el('rationale').style.display='none';el('next').style.display='none';el('answers').innerHTML='';q[2].forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${String.fromCharCode(65+i)}. ${a}`;b.onclick=()=>sata?toggle(i,b):grade([i]);el('answers').appendChild(b)});if(sata){const submit=document.createElement('button');submit.className='next';submit.style.display='inline-block';submit.textContent='Check my selections';submit.onclick=()=>grade(selected);el('answers').appendChild(submit)}}
function toggle(i,b){if(selected.includes(i)){selected=selected.filter(x=>x!==i);b.style.borderColor=''}else{selected.push(i);b.style.borderColor='var(--blue)'}}
function clinicalThoughtProcess(q,key){const prompt=escapeHtml(q[1]),answerText=key.map(i=>`${String.fromCharCode(65+i)}. ${escapeHtml(q[2][i])}`).join('; '),stem=q[1].toLowerCase();let strategy;if(key.length>1)strategy='This is a select-all-that-apply item. Evaluate each option separately and select only the actions, findings, or teaching statements supported by the scenario.';else if(/priority|immediate|first 2 hours|urgent/.test(stem))strategy='This is a priority question. Start with the finding that signals the most immediate physiologic or safety concern before considering routine care.';else if(/teaching|understanding|instruction|teach/.test(stem))strategy='This is a teaching question. Choose the statement or action that shows safe understanding of the condition, treatment, or discharge plan.';else if(/which type|most likely|which condition|which finding|classification|document/.test(stem))strategy='This is an identification question. Match the defining assessment pattern in the stem with the condition or concept that uniquely fits it.';else strategy='Start by identifying the central clinical clue in the scenario, then choose the response that directly addresses that clue rather than a distractor from a related topic.';return `${strategy}<br><b>Question focus:</b> ${prompt}<br><b>Best match:</b> ${answerText} directly fits the specific cue and task in this question.`}
function grade(choice){const q=pool[index],key=Array.isArray(q[3])?q[3]:[q[3]],buttons=[...document.querySelectorAll('.answer')],ok=choice.length===key.length&&choice.every(x=>key.includes(x));buttons.forEach((b,i)=>{b.disabled=true;if(key.includes(i))b.classList.add('correct');else if(choice.includes(i))b.classList.add('wrong')});if(ok){correct++;streak++;}else{streak=-1;pool.splice(Math.min(index+3,pool.length),0,q)}const wrong=choice.filter(i=>!key.includes(i)),missed=key.filter(i=>!choice.includes(i)),correctText=key.map(i=>`${String.fromCharCode(65+i)}. ${escapeHtml(q[2][i])}`).join('; '),answerLabel=key.length>1?'Correct selections':'Correct answer';let feedback=`<b>${ok?'Correct — nice clinical judgment!':'Review this concept.'}</b><br><br><b>${answerLabel}:</b> ${correctText}<br><br><b>Clinical thought process:</b> ${clinicalThoughtProcess(q,key)}<br><br><b>Why this is correct:</b> ${q[4]}`;if(wrong.length||missed.length){feedback+='<ul>';wrong.forEach(i=>feedback+=`<li><b>${String.fromCharCode(65+i)} is not correct:</b> ${escapeHtml(optionReason(q,q[2][i]))}</li>`);missed.forEach(i=>feedback+=`<li><b>${String.fromCharCode(65+i)} should also be selected:</b> ${escapeHtml(q[2][i])} is supported by the priority nursing cues.</li>`);feedback+='</ul>'}el('score').textContent=`Correct: ${correct}`;el('rationale').innerHTML=feedback;el('rationale').style.display='block';el('next').style.display='inline-block'}
el('next').onclick=()=>{index++;if(index>=pool.length){el('game').style.display='none';el('summary').style.display='block';el('progressFill').style.width='100%';el('result').textContent=`You answered ${correct} of ${index} questions correctly. Missed concepts were repeated later in the round so you could practice them again.`}else show()};el('restart').onclick=start;start();
</script></body></html>
